name: Terraform Development CD

on:
  push:
    branches:
      - dev
jobs:
  terraform-apply:
    name: Terraform Apply to Dev
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Init (dev)
        run: terraform -chdir=terraform/env/dev init

      - name: Create terraform.secret.tfvars for CD
        working-directory: terraform/env/dev
        run: |
          cat > terraform.secret.tfvars << EOF
          aws_access_key_id = "${{ secrets.DEV_AWS_ACCESS_KEY_ID }}"
          aws_secret_access_key = "${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}"
          rds_username = "${{ secrets.RDS_USERNAME }}"
          rds_password = "${{ secrets.RDS_PASSWORD }}"
          domain_name = "${{ secrets.DEV_DOMAIN_NAME }}"
          EOF

      - name: Terraform Apply (dev)
        working-directory: terraform/env/dev
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            -var-file="terraform.secret.tfvars"